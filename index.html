<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrBan</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: #f1f5f9; margin: 0; }
    .card { background: white; max-width: 380px; margin: 20px auto; padding: 24px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #1e293b; font-size: 1.25rem; }
    label { display: block; text-align: left; margin: 12px 0 4px; font-weight: 600; color: #475569; font-size: 0.9rem; }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    #qrcode { margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Soluprint3d77</h2>
    <label for="amount">Montant (€)</label>
    <input type="number" id="amount" placeholder="0.00" step="0.01">
    <label for="ref">Référence / Motif</label>
    <input type="text" id="ref" placeholder="Facture N°">
    <div id="qrcode-container">
      <canvas id="qrcode"></canvas>
    </div>
  </div>

  <script>
    const iban = "FR7617328844006714080974165";
    const bic = "SWNBFR22";
    const name = "Soluprint3d77 - S. ROUCHET EI";

    const qr = new QRious({
      element: document.getElementById('qrcode'),
      size: 240
    });

    function updateQR() {
      const amountVal = parseFloat(document.getElementById('amount').value || 0).toFixed(2);
      const refVal = document.getElementById('ref').value || 'Paiement';
      const epcData = `BCD\n002\n1\nSCT\n${bic}\n${name}\n${iban}\nEUR${amountVal}\n\n${refVal}\n`;
      qr.value = epcData;
    }

    document.getElementById('amount').addEventListener('input', updateQR);
    document.getElementById('ref').addEventListener('input', updateQR);
    updateQR();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
